<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retrospectiva Anos 80</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(-45deg, #2b1055, #7597de, #ff007f, #00f0ff, #b500ff);
      background-size: 400% 400%;
      animation: gradient80s 10s ease infinite;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradient80s {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .particula {
      position: absolute;
      bottom: -60px;
      font-size: 2rem;
      user-select: none;
      pointer-events: none;
      animation: flutuar 7s linear infinite;
      z-index: 1;
      filter: drop-shadow(0 0 10px #00f0ff);
    }

    @keyframes flutuar {
      0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-115vh) rotate(360deg) scale(1.3); opacity: 0; }
    }

    h1 {
      position: absolute;
      top: 25px;
      color: #fff;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 40px #00f0ff;
      z-index: 10;
    }

    .slide-container {
      position: relative;
      width: 88vw;
      max-width: 850px;
      height: 72vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(15, 5, 29, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      box-shadow: 0 0 30px #ff007f, 0 0 60px rgba(0, 240, 255, 0.4);
      border: 2px solid #00f0ff;
      overflow: hidden;
      z-index: 5;
    }

    .slide-container img {
      max-width: 95%;
      max-height: 95%;
      object-fit: contain;
      border-radius: 12px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .slide-container img.trocando {
      opacity: 0;
      transform: scale(0.96);
    }

    .btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 0, 127, 0.4);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 2px solid #00f0ff;
      width: 55px;
      height: 55px;
      font-size: 24px;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      user-select: none;
      z-index: 10;
      box-shadow: 0 0 15px #ff007f;
    }

    .btn:hover {
      background: #00f0ff;
      color: #000;
      border-color: #ff007f;
      transform: translateY(-50%) scale(1.15);
      box-shadow: 0 0 25px #00f0ff;
    }

    .btn-prev { left: 20px; }
    .btn-next { right: 20px; }

    .contador {
      position: absolute;
      bottom: 18px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #ff007f;
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #00f0ff;
      text-shadow: 0 0 5px #00f0ff;
      z-index: 10;
    }

    /* Botão Flutuante de Música Neon */
    .audio-control {
      position: absolute;
      top: 25px;
      right: 25px;
      background: rgba(15, 5, 29, 0.8);
      border: 2px solid #00f0ff;
      color: #ff007f;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      z-index: 20;
      box-shadow: 0 0 15px #00f0ff;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .audio-control:hover {
      background: #ff007f;
      color: #fff;
      box-shadow: 0 0 25px #ff007f;
    }
  </style>
</head>
<body>

  <button class="audio-control" id="btnMusica" onclick="toggleMusica()">🎵 Tocar Música</button>
  <audio id="musicaFundo" src="midia/musica.mp3" loop></audio>

  <div id="particulas-container"></div>

  <h1>🕺 Retrospectiva 80's 🪩</h1>

  <div class="slide-container">
    <button class="btn btn-prev" onclick="mudarSlide(-1)">&#10094;</button>
    <img id="imagem-slide" src="" alt="Slide Retrospectiva">
    <button class="btn btn-next" onclick="mudarSlide(1)">&#10095;</button>
    <div class="contador" id="contador">1 / 90</div>
  </div>

  <script>
    const totalDeFotos = 90;
    let indexAtual = 1;

    const imgElement = document.getElementById('imagem-slide');
    const contadorElement = document.getElementById('contador');
    const audio = document.getElementById('musicaFundo');
    const btnMusica = document.getElementById('btnMusica');

    function toggleMusica() {
      if (audio.paused) {
        audio.play();
        btnMusica.innerText = '⏸️ Pausar Música';
      } else {
        audio.pause();
        btnMusica.innerText = '🎵 Tocar Música';
      }
    }

    atualizarSlide();

    function mudarSlide(direcao) {
      imgElement.classList.add('trocando');
      setTimeout(() => {
        indexAtual += direcao;
        if (indexAtual > totalDeFotos) indexAtual = 1;
        if (indexAtual < 1) indexAtual = totalDeFotos;
        atualizarSlide();
        imgElement.classList.remove('trocando');
      }, 200);
    }

    function atualizarSlide() {
      const extensoes = ['.jpeg', '.jpg', '.jpge', '.png'];
      let extIndex = 0;

      function carregar() {
        if (extIndex >= extensoes.length) return;
        imgElement.src = `midia/foto${indexAtual}${extensoes[extIndex]}`;
      }

      imgElement.onerror = function() {
        extIndex++;
        carregar();
      };

      carregar();
      contadorElement.innerText = `${indexAtual} / ${totalDeFotos}`;
    }

    setInterval(() => { mudarSlide(1); }, 3500);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') mudarSlide(1);
      if (e.key === 'ArrowLeft') mudarSlide(-1);
    });

    const particulasContainer = document.getElementById('particulas-container');
    const icones80s = ['✨', '⚡', '🪩', '🌟', '💎'];

    function criarParticula() {
      const p = document.createElement('div');
      p.className = 'particula';
      p.innerText = icones80s[Math.floor(Math.random() * icones80s.length)];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (Math.random() * 3 + 5) + 's';
      p.style.fontSize = (Math.random() * 1.2 + 1.2) + 'rem';
      particulasContainer.appendChild(p);

      setTimeout(() => { p.remove(); }, 8000);
    }

    setInterval(criarParticula, 600);
  </script>

</body>
</html>
