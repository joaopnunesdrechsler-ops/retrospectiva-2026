<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrospectiva Anos 80</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #fff;
            font-family: 'VT323', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 40px #ff007f;
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-align: center;
        }

        .slideshow-container {
            position: relative;
            max-width: 800px;
            width: 90%;
            height: 500px;
            border: 4px solid #00f3ff;
            box-shadow: 0 0 15px #00f3ff, inset 0 0 15px #00f3ff;
            background-color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .slide.active {
            display: block;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            background: #ff007f;
            color: #fff;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff007f;
            transition: 0.2s;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        button:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 15px #00f3ff;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <h1>RETROSPECTIVA ANOS 80</h1>

    <div class="slideshow-container" id="slideshow">
        <!-- As imagens serão inseridas dinamicamente pelo JavaScript -->
    </div>

    <div class="controls">
        <button onclick="mudarSlide(-1)">❮ Ant</button>
        <button onclick="tocarAudio()">🎵 Tocar Música</button>
        <button onclick="mudarSlide(1)">Próx ❯</button>
    </div>

    <!-- Arquivo de áudio na pasta midia/ -->
    <audio id="musicaFundo" src="midia/musica.mp3" loop></audio>

    <script>
        const totalFotos = 90;
        const container = document.getElementById('slideshow');
        let indexAtual = 0;

        // Gerar as tags de imagem para foto1.jpeg até foto90.jpeg
        for (let i = 1; i <= totalFotos; i++) {
            const img = document.createElement('img');
            img.src = `midia/foto${i}.jpeg`;
            img.alt = `Foto ${i}`;
            img.classList.add('slide');
            if (i === 1) img.classList.add('active');
            container.appendChild(img);
        }

        const slides = document.querySelectorAll('.slide');

        function mostrarSlide(n) {
            slides[indexAtual].classList.remove('active');
            indexAtual = (n + slides.length) % slides.length;
            slides[indexAtual].classList.add('active');
        }

        function mudarSlide(direcao) {
            mostrarSlide(indexAtual + direcao);
        }

        function tocarAudio() {
            const audio = document.getElementById('musicaFundo');
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        // Transição automática configurada para 2000 ms (2,0 segundos)
        setInterval(() => {
            mudarSlide(1);
        }, 2000);
    </script>
</body>
</html>
