<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrospectiva 80's</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Monoton&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0221;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Moldura neon externa da tela inteira */
        .outer-frame {
            position: relative;
            width: 96vw;
            height: 92vh;
            border: 3px solid #00f3ff;
            box-shadow: 0 0 15px #00f3ff, inset 0 0 15px #00f3ff;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 30px;
            background: radial-gradient(circle at center, #260a40 0%, #0d0221 100%);
            overflow: hidden;
        }

        /* Detalhes geométricos nos cantos da tela */
        .corner-decor {
            position: absolute;
            width: 45px;
            height: 45px;
            border: 2px solid #00f3ff;
            opacity: 0.8;
            box-shadow: 0 0 8px #00f3ff;
        }
        .corner-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
        .corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
        .corner-br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

        /* Grade no fundo estilo Synthwave */
        .grid-floor {
            position: absolute;
            bottom: -50px;
            width: 120%;
            height: 45vh;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(255, 0, 127, 0.4) 25%, rgba(255, 0, 127, 0.4) 26%, transparent 27%),
                linear-gradient(90deg, transparent 24%, rgba(255, 0, 127, 0.4) 25%, rgba(255, 0, 127, 0.4) 26%, transparent 27%);
            background-size: 50px 50px;
            transform: perspective(250px) rotateX(65deg);
            z-index: 1;
            pointer-events: none;
        }

        /* Título Retrospectiva 80's */
        .header-title {
            text-align: center;
            z-index: 2;
            margin-top: 5px;
        }

        .title-cursive {
            font-family: 'Monoton', cursive;
            font-size: 2.8rem;
            color: #ff007f;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
            line-height: 1;
            letter-spacing: 2px;
            transform: rotate(-3deg);
            margin-bottom: -15px;
        }

        .title-main {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3.2rem;
            color: #00f3ff;
            text-shadow: 0 0 15px #00f3ff, 0 0 30px #00f3ff, 0 0 45px #00f3ff;
            letter-spacing: 4px;
        }

        /* Container da Foto com Moldura Ornamentada */
        .slideshow-wrapper {
            position: relative;
            z-index: 2;
            padding: 8px;
            border: 3px solid #00f3ff;
            border-radius: 8px;
            box-shadow: 0 0 20px #00f3ff, inset 0 0 15px #00f3ff;
            background: rgba(13, 2, 33, 0.8);
        }

        /* Detalhes em círculo nos cantos do slide */
        .slideshow-wrapper::before, .slideshow-wrapper::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00f3ff;
            box-shadow: 0 0 8px #00f3ff;
        }
        .slideshow-wrapper::before { top: 4px; left: 4px; }
        .slideshow-wrapper::after { top: 4px; right: 4px; }

        .slideshow-container {
            width: 580px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #000;
            border: 2px solid #00f3ff;
            border-radius: 4px;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .slide.active {
            display: block;
        }

        /* Painel de Controle Inferior */
        .control-panel {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 850px;
            border: 3px solid #ff007f;
            box-shadow: 0 0 20px #ff007f, inset 0 0 10px #ff007f;
            border-radius: 12px;
            padding: 15px 25px;
            background: rgba(13, 2, 33, 0.95);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn-neon {
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            padding: 10px 22px;
            color: #00f3ff;
            background: transparent;
            border: 2px solid #00f3ff;
            border-radius: 8px;
            box-shadow: 0 0 10px #00f3ff, inset 0 0 10px #00f3ff;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-neon-pink {
            color: #ff007f;
            border-color: #ff007f;
            box-shadow: 0 0 10px #ff007f, inset 0 0 10px #ff007f;
        }

        .btn-neon:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 20px #00f3ff;
        }

        .btn-neon-pink:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 20px #ff007f;
        }

        /* Barra de Status Inferior */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #00f3ff;
            letter-spacing: 1px;
            padding-top: 5px;
            border-top: 1px solid rgba(255, 0, 127, 0.4);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .knob {
            width: 18px;
            height: 18px;
            border: 2px solid #00f3ff;
            border-radius: 50%;
            box-shadow: 0 0 5px #00f3ff;
            position: relative;
        }

        .knob::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 7px;
            width: 2px;
            height: 6px;
            background: #00f3ff;
        }

        .now-playing {
            color: #00f3ff;
            font-weight: 600;
        }

        .mix-title {
            color: #ff007f;
            font-weight: 800;
            text-shadow: 0 0 8px #ff007f;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <div class="outer-frame">
        <div class="corner-decor corner-tl"></div>
        <div class="corner-decor corner-tr"></div>
        <div class="corner-decor corner-bl"></div>
        <div class="corner-decor corner-br"></div>

        <div class="grid-floor"></div>

        <div class="header-title">
            <div class="title-cursive">Retrospectiva</div>
            <div class="title-main">80's</div>
        </div>

        <div class="slideshow-wrapper">
            <div class="slideshow-container" id="slideshow">
                <!-- Fotos inseridas dinamicamente pelo JS -->
            </div>
        </div>

        <div class="control-panel">
            <div class="button-group">
                <button class="btn-neon" onclick="mudarSlide(-1)">◄ ANTERIOR</button>
                <button class="btn-neon btn-neon-pink" onclick="tocarAudio()">🎵 PLAY MÚSICA</button>
                <button class="btn-neon" onclick="mudarSlide(1)">PRÓXIMO ►</button>
            </div>
            
            <div class="status-bar">
                <div class="volume-control">
                    <div class="knob"></div>
                    <span>VOLUME</span>
                </div>
                <div class="now-playing">
                    REPRODUZINDO: A-HA - TAKE ON ME
                </div>
                <div class="mix-title">
                    80's HITS MIX
                </div>
            </div>
        </div>
    </div>

    <audio id="musicaFundo" src="midia/musica.mp3" loop></audio>

    <script>
        const totalFotos = 90;
        const container = document.getElementById('slideshow');
        let indexAtual = 0;

        // Gerar foto1.jpeg até foto90.jpeg na pasta midia/
        for (let i = 1; i <= totalFotos; i++) {
            const img = document.createElement('img');
            img.src = `midia/foto${i}.jpeg`;
            img.alt = `Foto ${i}`;
            img.classList.add('slide');
            if (i === 1) img.classList.add('active');
            container.appendChild(img);
        }

        const slides = document.querySelectorAll('.slide');

        function mostrarSlide(n) {
            slides[indexAtual].classList.remove('active');
            indexAtual = (n + slides.length) % slides.length;
            slides[indexAtual].classList.add('active');
        }

        function mudarSlide(direcao) {
            mostrarSlide(indexAtual + direcao);
        }

        function tocarAudio() {
            const audio = document.getElementById('musicaFundo');
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        // Troca automática a cada 2000 ms (2,0s)
        setInterval(() => {
            mudarSlide(1);
        }, 2000);
    </script>
</body>
</html>
